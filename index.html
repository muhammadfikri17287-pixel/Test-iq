<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ Portal | Identity</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 35px; border-radius: 20px; text-align: center; width: 90%; max-width: 350px; border-top: 5px solid #00d2ff; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #00d2ff; color: #0f172a; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>IQ PORTAL</h1>
        <input type="text" id="namaSiswa" placeholder="Nama Lengkap Anda">
        <input type="text" id="tokenSiswa" placeholder="Kode Akses">
        <button onclick="mulaiTes()">MULAI ANALISIS</button>
        <p onclick="loginAdmin()" style="font-size: 11px; color: #475569; margin-top: 20px; cursor: pointer;">Administrator System</p>
    </div>

    <script>
    async function mulaiTes() {
        const nama = document.getElementById('namaSiswa').value;
        const code = document.getElementById('tokenSiswa').value.toUpperCase();
        if(!nama || !code) return Swal.fire('Error', 'Nama dan Kode wajib diisi!', 'error');

        const res = await fetch('/api/validate', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({code}) });
        if(res.ok) {
            localStorage.setItem('namaPeserta', nama);
            window.location.href = "soal.html";
        } else {
            Swal.fire('Gagal', 'Kode Akses Salah!', 'error');
        }
    }

    async function loginAdmin() {
        const { value: form } = await Swal.fire({
            title: 'Admin Panel',
            html: '<input id="u" class="swal2-input" placeholder="User"><input id="p" type="password" class="swal2-input" placeholder="Pass">',
            preConfirm: () => [document.getElementById('u').value, document.getElementById('p').value]
        });
        if(form) {
            const res = await fetch('/api/admin', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: form[0], password: form[1]}) });
            const data = await res.json();
            if(data.success) {
                let listSkor = data.dataSkor.map(s => `<li>${s.nama}: <b>${s.skor} IQ</b></li>`).join('') || "Belum ada data.";
                Swal.fire({
                    title: 'Database Hasil',
                    html: `<b>Token Hari Ini: ${data.dailyCode}</b><hr><ul style="text-align:left">${listSkor}</ul>`,
                    confirmButtonColor: '#00d2ff'
                });
            } else { Swal.fire('Gagal', 'Akses ditolak!', 'error'); }
        }
    }
    </script>
</body>
</html>
