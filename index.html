<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligence Quotient Test | Portal Resmi</title>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --dark: #0f172a;
            --card: #1e293b;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .login-card {
            background: var(--card);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .icon-box {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 26px;
            background: linear-gradient(to right, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            text-transform: uppercase;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 8px;
            margin-left: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 2px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(58, 123, 213, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .admin-trigger {
            margin-top: 25px;
            font-size: 12px;
            color: #475569;
            cursor: pointer;
            transition: 0.3s;
        }

        .admin-trigger:hover {
            color: var(--primary);
        }

        /* Override SweetAlert2 Style agar matching dengan tema Dark */
        .swal2-popup {
            background: #1e293b !important;
            color: white !important;
            border-radius: 20px !important;
        }
        .swal2-title, .swal2-html-container { color: white !important; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="icon-box">🧠</div>
    <h1>IQ TEST CENTER</h1>
    <p class="subtitle">Ukur potensi kognitif Anda sekarang</p>

    <div class="input-group">
        <label>Kode Akses Peserta</label>
        <input type="text" id="studentCode" placeholder="Masukkan 10 digit kode..." maxlength="10">
    </div>
    
    <button onclick="loginSiswa()">MULAI ANALISIS</button>

    <div class="admin-trigger" onclick="loginAdmin()">System Administrator</div>
</div>

<script>
// AGAR TIDAK ADA POP-UP BIASA, KITA HAPUS SEMUA PERINTAH 'alert'
async function loginSiswa() {
    const code = document.getElementById('studentCode').value.toUpperCase().trim();

    if (!code) {
        return Swal.fire({
            icon: 'info',
            title: 'Kode Diperlukan',
            text: 'Harap masukkan kode akses untuk memulai tes.',
            confirmButtonColor: '#3a7bd5'
        });
    }

    // Tampilan Loading Modern
    Swal.fire({
        title: 'Menghubungkan ke Server...',
        html: 'Memvalidasi data peserta',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading() }
    });

    try {
        const response = await fetch('/api/validate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code })
        });
        
        const data = await response.json();
        
        if (data.success) {
            Swal.fire({
                icon: 'success',
                title: 'Akses Diberikan',
                text: 'Mempersiapkan modul soal...',
                timer: 2000,
                showConfirmButton: false
            }).then(() => {
                window.location.href = "soal.html"; 
            });
        } else {
            Swal.fire({
                icon: 'error',
                title: 'Akses Gagal',
                text: data.message,
                confirmButtonColor: '#3a7bd5'
            });
        }
    } catch (err) {
        Swal.fire({
            icon: 'error',
            title: 'Masalah Koneksi',
            text: 'Gagal terhubung ke pusat data. Cek internet lo!',
            confirmButtonColor: '#3a7bd5'
        });
    }
}

async function loginAdmin() {
    const { value: password } = await Swal.fire({
        title: 'Akses Sistem',
        input: 'password',
        inputLabel: 'Masukkan Password Admin',
        inputPlaceholder: 'Sandi rahasia...',
        showCancelButton: true,
        confirmButtonColor: '#3a7bd5',
        cancelButtonColor: '#1e293b'
    });

    if (password) {
        try {
            const response = await fetch('/api/admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await response.json();
            
            if (data.success) {
                Swal.fire({
                    icon: 'success',
                    title: 'Login Berhasil',
                    html: `Token Akses Hari Ini:<br><br><span style="font-size:24px; font-weight:bold; color:#00d2ff">${data.dailyCode}</span>`,
                    confirmButtonText: 'Salin Kode',
                    confirmButtonColor: '#3a7bd5'
                }).then(() => {
                    navigator.clipboard.writeText(data.dailyCode);
                });
            } else {
                Swal.fire({ icon: 'error', title: 'Ditolak', text: 'Password admin tidak valid.' });
            }
        } catch (err) {
            Swal.fire({ icon: 'error', title: 'Error', text: 'Gagal memproses permintaan.' });
        }
    }
}

// Support tombol Enter
document.getElementById('studentCode').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') loginSiswa();
});
</script>

</body>
</html>
