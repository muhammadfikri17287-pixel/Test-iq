
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ Portal | Identity Center</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary: #00d2ff; --bg: #0f172a; --card: #1e293b; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: var(--card); padding: 40px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 100%; max-width: 380px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        h1 { background: linear-gradient(to right, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 10px; font-size: 28px; font-weight: 800; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: white; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        input:focus { outline: none; border-color: var(--primary); }
        button { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(45deg, #3a7bd5, #00d2ff); color: white; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .admin-trigger { margin-top: 25px; font-size: 12px; color: #475569; cursor: pointer; }
        .swal2-popup { background: #1e293b !important; color: white !important; border-radius: 20px !important; }
        .swal2-title, .swal2-html-container { color: white !important; }
    </style>
</head>
<body>
    <div class="card">
        <h1>IQ PORTAL</h1>
        <p>Sistem Analisis Potensi Kognitif</p>
        <input type="text" id="nama" placeholder="Nama Peserta">
        <input type="text" id="code" placeholder="Kode Akses">
        <button onclick="mulai()">MULAI ANALISIS</button>
        <div class="admin-trigger" onclick="adminLogin()">Access Administrator System</div>
    </div>

    <script>
    async function mulai() {
        const nama = document.getElementById('nama').value.trim();
        const code = document.getElementById('code').value.toUpperCase().trim();
        
        if(!nama || !code) return Swal.fire('Data Kosong', 'Nama dan Kode Akses wajib diisi.', 'warning');

        try {
            const res = await fetch('/api/validate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ code })
            });
            const data = await res.json();
            if(data.success) {
                localStorage.setItem('iq_user_name', nama);
                window.location.href = "soal.html";
            } else {
                Swal.fire('Akses Ditolak', data.message, 'error');
            }
        } catch (e) { Swal.fire('Error', 'Gagal menyambung ke server', 'error'); }
    }

    async function adminLogin() {
        const { value: form } = await Swal.fire({
            title: 'Admin Access',
            html: '<input id="u" class="swal2-input" placeholder="Username"><input id="p" type="password" class="swal2-input" placeholder="Password">',
            preConfirm: () => [document.getElementById('u').value, document.getElementById('p').value]
        });
        if(form) {
            const res = await fetch('/api/admin', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: form[0], password: form[1] })
            });
            const data = await res.json();
            if(data.success) {
                let list = data.dataSkor.map(s => `<tr><td style="padding:8px;border-bottom:1px solid #334155">${s.nama}</td><td style="text-align:center;border-bottom:1px solid #334155">${s.benar}/${s.total}</td><td style="text-align:right;border-bottom:1px solid #334155;color:#00d2ff;font-weight:bold">${s.iq}</td></tr>`).join('');
                Swal.fire({
                    title: 'Administrator Dashboard',
                    html: `<div style="text-align:left;font-size:13px"><b>Token Hari Ini:</b> <code style="color:#00d2ff">${data.dailyCode}</code><hr><table style="width:100%"><thead><tr style="color:#94a3b8"><th>Nama</th><th>Hasil</th><th>IQ</th></tr></thead><tbody>${list || '<tr><td colspan="3" style="text-align:center;padding-top:10px">Belum ada peserta</td></tr>'}</tbody></table></div>`,
                    width: '450px'
                });
            } else { Swal.fire('Gagal', 'Akses Admin Salah!', 'error'); }
        }
    }
    </script>
</body>
</html>
