<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT-AM | Login Tes IQ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a2e; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #16213e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 350px; text-align: center; border-top: 5px solid #e94560; }
        h2 { margin-bottom: 20px; color: #e94560; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #0f3460; color: white; text-align: center; font-size: 16px; }
        button { width: 100%; padding: 12px; margin-top: 15px; border-radius: 8px; border: none; background: #e94560; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #ff4d6d; transform: scale(1.02); }
        .admin-link { margin-top: 20px; font-size: 12px; color: #533483; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>CBT-AM</h2>
    <p>Masukkan Kode Akses Siswa</p>
    <input type="text" id="studentCode" placeholder="Contoh: ARCH-XXXXX" autocomplete="off">
    <button onclick="loginSiswa()">MASUK UJIAN</button>
    <div class="admin-link" onclick="loginAdmin()">Panel Admin</div>
</div>

<script>
// 1. FUNGSI LOGIN SISWA
async function loginSiswa() {
    const code = document.getElementById('studentCode').value.toUpperCase();
    if (!code) return alert("Isi kodenya dulu, Bos!");

    try {
        const response = await fetch('/api/validate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code })
        });
        
        const data = await response.json();
        
        if (data.success) {
            alert("✅ Akses Diterima! Selamat mengerjakan.");
            window.location.href = "soal.html"; 
        } else {
            alert("❌ Gagal: " + data.message);
        }
    } catch (err) {
        alert("Server Vercel sedang sibuk!");
    }
}

// 2. FUNGSI LOGIN ADMIN (Untuk cek token harian)
async function loginAdmin() {
    const password = prompt("Masukkan Password Admin:");
    if (!password) return;

    try {
        const response = await fetch('/api/admin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
        });
        
        const data = await response.json();
        
        if (data.success) {
            alert("🔓 LOGIN ADMIN BERHASIL!\n\nKode Siswa Hari Ini: " + data.dailyCode);
            // Salin otomatis ke clipboard
            navigator.clipboard.writeText(data.dailyCode);
            alert("Kode " + data.dailyCode + " sudah disalin ke clipboard!");
        } else {
            alert("❌ Password Salah!");
        }
    } catch (err) {
        alert("Koneksi gagal!");
    }
}
</script>

</body>
</html>
