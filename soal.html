<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisis IQ</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 500px; background: #1e293b; padding: 25px; border-radius: 15px; }
        .opsi { display: block; background: #334155; padding: 12px; margin: 8px 0; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="qNum">Soal 1</h2>
        <p id="qText" style="font-size: 18px;"></p>
        <div id="options"></div>
        <button onclick="next()" style="width: 100%; padding: 12px; margin-top: 15px; background: #00d2ff; border: none; border-radius: 8px; font-weight: bold;">LANJUT</button>
    </div>

    <script>
        const soal = [
            { q: "Pola: 2, 4, 8, 16, ...", o: ["24", "32", "30", "64"], a: 1 },
            { q: "Mana yang tidak cocok?", o: ["Meja", "Kursi", "Lemari", "Air"], a: 3 },
            { q: "Jika A=1, B=2, maka CAB=?", o: ["312", "123", "213", "321"], a: 0 }
        ];
        let current = 0, skor = 0;

        function tampil() {
            document.getElementById('qNum').innerText = `Analisis ${current + 1}/${soal.length}`;
            document.getElementById('qText').innerText = soal[current].q;
            document.getElementById('options').innerHTML = soal[current].o.map((x, i) => 
                `<label class="opsi"><input type="radio" name="z" value="${i}"> ${x}</label>`).join('');
        }

        async function next() {
            const r = document.querySelector('input[name="z"]:checked');
            if(!r) return Swal.fire('Oops', 'Pilih jawaban dulu!', 'warning');
            if(parseInt(r.value) === soal[current].a) skor += 40; // Contoh kalkulasi skor

            if(current < soal.length - 1) {
                current++; tampil();
            } else {
                const nama = localStorage.getItem('namaPeserta');
                await fetch('/api/submit', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ nama, skor }) 
                });
                Swal.fire('Selesai', `Skor IQ Anda: ${skor}`, 'success').then(() => window.location.href = "/");
            }
        }
        tampil();
    </script>
</body>
</html>
