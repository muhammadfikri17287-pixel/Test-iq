<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes IQ - Ujian Sekolah</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin: auto; }
        .header { border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-bottom: 20px; }
        .soal-text { font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        .opsi { display: block; background: #e9ecef; margin: 10px 0; padding: 12px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .opsi:hover { background: #dee2e6; }
        input[type="radio"] { margin-right: 10px; }
        .btn-next { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; float: right; }
        .footer { margin-top: 50px; text-align: center; font-size: 12px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Soal Tes IQ 🧠</h2>
        <p id="timer">Sisa Waktu: 30:00</p>
    </div>

    <div id="quiz-container">
        <div class="soal-text">1. Jika "MATA" adalah "2121", maka "KATA" adalah...</div>
        <label class="opsi"><input type="radio" name="soal1" value="A"> 1121</label>
        <label class="opsi"><input type="radio" name="soal1" value="B"> 3121</label>
        <label class="opsi"><input type="radio" name="soal1" value="C"> 2121</label>
        <label class="opsi"><input type="radio" name="soal1" value="D"> 4121</label>
        
        <button class="btn-next" onclick="submitTest()">Selesai & Kirim</button>
    </div>

    <div class="footer">
        &copy; 2026 CBT-AM Simulator - Architect System
    </div>
</div>

<script>
    function submitTest() {
        alert("Jawaban Anda telah terkirim ke server! Terima kasih sudah mengikuti tes.");
        window.location.href = "/"; // Balik ke halaman login
    }

    // Timer simpel 30 menit
    let time = 1800;
    setInterval(() => {
        let min = Math.floor(time / 60);
        let sec = time % 60;
        document.getElementById('timer').innerText = `Sisa Waktu: ${min}:${sec < 10 ? '0'+sec : sec}`;
        if(time > 0) time--;
    }, 1000);
</script>

</body>
</html>
