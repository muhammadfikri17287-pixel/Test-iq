<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensa Style | IQ Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e293b; padding: 30px; border-radius: 20px; border: 1px solid #334155; }
        .timer-bar { font-size: 24px; font-weight: bold; color: #00d2ff; text-align: center; margin-bottom: 20px; }
        .question { font-size: 20px; margin-bottom: 20px; }
        .option { display: block; background: #334155; padding: 15px; margin: 10px 0; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .option:hover { background: #475569; }
        .stats { display: flex; justify-content: space-between; font-size: 14px; color: #94a3b8; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="timer-bar" id="timer">60:00</div>
        <div class="question" id="qText">Menyiapkan analisis...</div>
        <div id="options"></div>
        <div class="stats">
            <span>Terjawab: <b id="statTotal">0</b></span>
            <span>Benar: <b id="statCorrect">0</b></span>
        </div>
    </div>

    <script>
        let timeLeft = 3600; // 60 Menit
        let correctCount = 0;
        let totalCount = 0;
        let currentAnswer = 0;

        // Generator Soal Logika/Matematika Random
        function generateQuestion() {
            const types = ['pola', 'hitung', 'logika'];
            const type = types[Math.floor(Math.random() * types.length)];
            let q = "", opts = [], ans = 0;

            if(type === 'hitung') {
                const a = Math.floor(Math.random() * 50), b = Math.floor(Math.random() * 50);
                q = `Berapakah hasil dari ${a} + ${b}?`;
                ans = a + b;
                opts = [ans, ans+2, ans-1, ans+5].sort(() => Math.random() - 0.5);
            } else if(type === 'pola') {
                const start = Math.floor(Math.random() * 10), step = Math.floor(Math.random() * 5) + 1;
                q = `Lanjutkan pola: ${start}, ${start+step}, ${start+(step*2)}, ...`;
                ans = start + (step * 3);
                opts = [ans, ans+step, ans-step, start+(step*4)].sort(() => Math.random() - 0.5);
            } else {
                q = "Jika semua A adalah B, dan semua B adalah C, maka...";
                const options = ["Semua A adalah C", "Semua C adalah A", "Beberapa A bukan C", "Tidak ada kesimpulan"];
                ans = options[0];
                opts = options.sort(() => Math.random() - 0.5);
            }

            document.getElementById('qText').innerText = q;
            currentAnswer = ans;
            document.getElementById('options').innerHTML = opts.map(o => 
                `<div class="option" onclick="check('${o}')">${o}</div>`).join('');
        }

        async function check(val) {
            totalCount++;
            if(val == currentAnswer) correctCount++;
            document.getElementById('statTotal').innerText = totalCount;
            document.getElementById('statCorrect').innerText = correctCount;
            generateQuestion();
        }

        function calculateIQ(correct, total) {
            // Rumus simulasi: Base 100 + (Bonus Benar * Faktor Kesulitan)
            if (total === 0) return 0;
            let ratio = correct / total;
            return Math.round(90 + (correct * 2) + (ratio * 10));
        }

        const timerInterval = setInterval(async () => {
            timeLeft--;
            let min = Math.floor(timeLeft / 60);
            let sec = timeLeft % 60;
            document.getElementById('timer').innerText = `${min}:${sec < 10 ? '0'+sec : sec}`;

            if(timeLeft <= 0) {
                clearInterval(timerInterval);
                const finalIQ = calculateIQ(correctCount, totalCount);
                const nama = localStorage.getItem('namaPeserta');

                await fetch('/api/submit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ nama, benar: correctCount, total: totalCount, iq: finalIQ })
                });

                Swal.fire({
                    title: 'Waktu Habis!',
                    html: `Analisis Selesai.<br>Skor IQ Anda: <b>${finalIQ}</b><br>Benar: ${correctCount}/${totalCount}`,
                    icon: 'success'
                }).then(() => window.location.href = "/");
            }
        }, 1000);

        generateQuestion();
    </script>
</body>
</html>
